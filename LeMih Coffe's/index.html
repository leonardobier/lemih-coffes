<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="imgs/icon.ico" type="image/png">
    <title>LeMih Coffe's</title>
</head>
<body>

    <!-- CABEÇALHO / HEADER -->
    <header class="header">

        <div class="logo">
            <img src="imgs/LeMih Coffe's LOGO ORIGINAL PNG.png" alt="Logo LeMih Coffe's">
        </div>

        <!-- BOTÃO HAMBÚRGUER (MOBILE) -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <i class="fa-solid fa-bars"></i>
        </label>

        <!-- NAVEGAÇÃO -->
        <nav class="nav">
            <button><a href="#">Home</a></button>
            <button><a href="#">Menu</a></button>
            <button><a href="#">About</a></button>
            <button><a href="#">Contact</a></button>
        </nav>

        <div class="contact">
            <a href="https://www.instagram.com/lemihcoffes/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/profile.php?id=100090187168155" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://wa.me/5547999999999" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        </div>

    </header>

    <!-- CONTEÚDO PRINCIPAL / CARDÁPIO -->
    <main class="container">
        <h1>Nosso Cardápio:</h1>

        <div class="menu-grid">
            
            <!-- Card 1: Café -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500&q=80" alt="Café Especial">
                <h3>Café Especial</h3>
                <p>Grãos selecionados com aroma e sabor marcantes.</p>
                <span class="price">R$ 8,50</span>
            </div>

            <!-- Card 2: Croissant -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500&q=80" alt="Croissant">
                <h3>Croissant Tradicional</h3>
                <p>Massa folhada artesanal e amanteigada.</p>
                <span class="price">R$ 12,00</span>
            </div>

            <!-- Card 3: Sanduíche -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500&q=80" alt="Sanduíche Natural">
                <h3>Sanduíche Gourmet</h3>
                <p>Pão de fermentação natural com recheio especial.</p>
                <span class="price">R$ 18,90</span>
            </div>

        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LeMih Coffe's. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
